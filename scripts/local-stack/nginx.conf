# Local stand-in for containers/reverseProxy: routes the local.* hostnames on
# :80 to the natively-running API and the FusionAuth container. Mounted into
# the edge container by scripts/local-stack.sh; never deployed. No TLS — that
# job only exists in prod.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Both app hostnames land on simulationAPI, exactly like prod — the API's
# find-my-way host constraints tell its gateway and backend roles apart.
server {
  listen 80;
  server_name local.allin.makejohnacoffee.com local.api.makejohnacoffee.com;
  location / {
    proxy_pass http://host.docker.internal:3003;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 80;
  server_name local.id.makejohnacoffee.com;
  location / {
    proxy_pass http://fusionauth:9011;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 80;
  }
}

server {
  listen 80 default_server;
  return 404;
}
