# Lives on the EC2 box at ~/containers/simulationWeb/docker-compose.yml.
# The deploy pipeline sets IMAGE to the freshly-built tag and runs `up -d`.
services:
  app:
    image: ${IMAGE:-ghcr.io/jbframe/big-equity/simulationweb:latest}
    # A long-running web server, unlike the batch-job sims: keep it up across
    # reboots and crashes.
    restart: unless-stopped
    ports:
      # Loopback-only: nginx on the host terminates TLS for
      # https://allin.makejohnacoffee.com and proxies here (ADR-001).
      # Port 8080 is never reachable from the internet directly.
      - "127.0.0.1:8080:80"
