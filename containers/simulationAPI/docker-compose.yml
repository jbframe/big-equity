# Lives on the EC2 box at ~/containers/simulationAPI/docker-compose.yml.
# The deploy pipeline sets IMAGE to the freshly-built tag and runs `up -d`.
services:
  app:
    image: ${IMAGE:-ghcr.io/jbframe/big-equity/simulationapi:latest}
    # Stable DNS name the reverseProxy container targets on simulation-net
    # (ADR-009) — proxy_pass http://simulationapi:3003.
    container_name: simulationapi
    # Long-running HTTP service, unlike the batch simulators.
    restart: unless-stopped
    # No host ports: the reverseProxy container (ADR-009) is the sole public
    # path in, over simulation-net; the container never listens on a host
    # interface.
    # DATABASE_URL, written by the deploy pipeline from the
    # SIMULATIONDB_PASSWORD secret (ADR-003).
    env_file: .env
    # Shared private network with simulationDB — the API is its only client.
    networks:
      - simulation-net
    # node:24-alpine ships busybox wget but no curl, so the liveness probe
    # uses wget. Reports health even before the nginx server block exists.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Created by user_data at first boot and idempotently by deploy.yml.
  simulation-net:
    external: true
