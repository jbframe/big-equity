version: 2
updates:
  # Keep GitHub Actions pinned-by-SHA but never stale: Dependabot opens PRs
  # that bump both the commit SHA and the trailing `# vX.Y.Z` comment, so we
  # get supply-chain safety (pinned commits) without losing security patches.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR per week for routine action bumps instead of one per action.
      actions:
        patterns: ["*"]

  # Python dependencies for the simulationPY container (requirements.txt).
  - package-ecosystem: pip
    directory: /containers/simulationPY
    schedule:
      interval: weekly

  # Base image for the simulationPY container (python:3.12-slim in Dockerfile).
  - package-ecosystem: docker
    directory: /containers/simulationPY
    schedule:
      interval: weekly

  # npm dependencies for the simulationTS container (package.json / lockfile).
  - package-ecosystem: npm
    directory: /containers/simulationTS
    schedule:
      interval: weekly

  # Base image for the simulationTS container (node:24-alpine in Dockerfile).
  - package-ecosystem: docker
    directory: /containers/simulationTS
    schedule:
      interval: weekly

  # npm dependencies for the simulationWeb FE container (package.json / lockfile).
  - package-ecosystem: npm
    directory: /containers/simulationWeb
    schedule:
      interval: weekly

  # Base images for the simulationWeb container (node + nginx in Dockerfile).
  - package-ecosystem: docker
    directory: /containers/simulationWeb
    schedule:
      interval: weekly
