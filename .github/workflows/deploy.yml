name: deploy

on:
  push:
    branches: [main]
    paths: ["containers/**"]
  workflow_dispatch: {}

jobs:
  # Discover every containers/<name>/ that has a docker-compose.yml, so adding
  # a new container is just a new folder — no workflow edits needed. Dirs with
  # a Dockerfile get built and pushed to GHCR; compose-only dirs (upstream
  # images, e.g. simulationDB per ADR-003) skip the build and just deploy.
  discover:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.find.outputs.containers }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: find
        run: |
          containers=$(for d in containers/*/; do
            name=$(basename "$d")
            [ -f "$d/docker-compose.yml" ] || continue
            [ -f "$d/Dockerfile" ] && build=true || build=false
            echo "{\"name\":\"$name\",\"build\":$build}"
          done | jq -cs .)
          echo "containers=$containers" >> "$GITHUB_OUTPUT"
          echo "Found: $containers"

  deploy:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(needs.discover.outputs.containers) }}
    name: deploy (${{ matrix.container.name }})
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Compute image name (GHCR requires lowercase)
        if: matrix.container.build
        id: vars
        env:
          MATRIX_CONTAINER: ${{ matrix.container.name }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          name="${MATRIX_CONTAINER,,}"
          echo "image=ghcr.io/${repo}/${name}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: matrix.container.build
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: matrix.container.build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: containers/${{ matrix.container.name }}
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:${{ github.sha }}

      - name: Sync compose file to box
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: containers/${{ matrix.container.name }}/docker-compose.yml
          target: ~/containers/${{ matrix.container.name }}
          strip_components: 2

      # simulationDB also ships its first-boot role script (ADR-008). The
      # postgres image only executes it when initializing an empty data
      # volume, so re-syncing it on every deploy is harmless.
      - name: Sync initdb scripts to box
        if: matrix.container.name == 'simulationDB'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: containers/simulationDB/initdb/*
          target: ~/containers/simulationDB/initdb
          strip_components: 3

      # fusionAuth ships its first-boot kickstart the same way (theme, tenant
      # issuer, initial admin user). FusionAuth only reads it when
      # initializing an empty database, so re-syncing it on every deploy is
      # harmless too.
      - name: Sync kickstart to box
        if: matrix.container.name == 'fusionAuth'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: containers/fusionAuth/kickstart.json
          target: ~/containers/fusionAuth
          strip_components: 2

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          IMAGE: ${{ matrix.container.build && format('{0}:{1}', steps.vars.outputs.image, github.sha) || '' }}
          CONTAINER: ${{ matrix.container.name }}
          BUILD: ${{ matrix.container.build }}
          # Cluster superuser (ADR-008): initdb, backups, and FusionAuth
          # schema upgrades. App containers use the per-database manager
          # roles below, never this.
          DBADMIN_PASSWORD: ${{ secrets.DBADMIN_PASSWORD }}
          SIMULATIONDB_PASSWORD: ${{ secrets.SIMULATIONDB_PASSWORD }}
          FUSIONAUTHDB_PASSWORD: ${{ secrets.FUSIONAUTHDB_PASSWORD }}
          # simulationAPI's OIDC relying-party secrets (ADR-007): the
          # poker_equity client secret and the session-cookie signing key.
          FUSIONAUTH_CLIENT_SECRET: ${{ secrets.FUSIONAUTH_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          # FusionAuth first-boot kickstart (empty database only): the
          # initial admin login it creates in place of the Setup Wizard.
          FUSIONAUTH_ADMIN_EMAIL: ${{ secrets.FUSIONAUTH_ADMIN_EMAIL }}
          FUSIONAUTH_ADMIN_PASSWORD: ${{ secrets.FUSIONAUTH_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,CONTAINER,BUILD,DBADMIN_PASSWORD,SIMULATIONDB_PASSWORD,FUSIONAUTHDB_PASSWORD,FUSIONAUTH_CLIENT_SECRET,SESSION_SECRET,FUSIONAUTH_ADMIN_EMAIL,FUSIONAUTH_ADMIN_PASSWORD
          script: |
            set -e
            # Private path between simulationAPI and simulationDB (ADR-003).
            # user_data creates it at first boot; this covers boxes that
            # predate that script.
            docker network create simulation-net || true
            cd ~/containers/$CONTAINER
            [ -f .env ] || touch .env          # env_file needs it to exist

            # Secret-derived .env files, rewritten on every deploy so a
            # password rotation is just "update the secret + redeploy"
            # (ADR-003). Other containers keep their hand-seeded .env.
            # simulationDB seeds all three roles (ADR-008): the dbadmin
            # superuser initdb creates, plus the per-database manager
            # passwords its first-boot script (initdb/01-roles.sh) needs.
            if [ "$CONTAINER" = "simulationDB" ]; then
              if [ -z "$DBADMIN_PASSWORD" ] || [ -z "$SIMULATIONDB_PASSWORD" ] || [ -z "$FUSIONAUTHDB_PASSWORD" ]; then
                echo "DBADMIN_PASSWORD, SIMULATIONDB_PASSWORD and FUSIONAUTHDB_PASSWORD secrets must be set" >&2
                exit 1
              fi
            fi
            if [ "$CONTAINER" = "simulationAPI" ]; then
              if [ -z "$SIMULATIONDB_PASSWORD" ]; then
                echo "SIMULATIONDB_PASSWORD secret is not set" >&2
                exit 1
              fi
              # simulationAPI is also the OIDC login wall for the SPA
              # (ADR-007), so it needs the FusionAuth client secret and a
              # session key.
              if [ -z "$FUSIONAUTH_CLIENT_SECRET" ] || [ -z "$SESSION_SECRET" ]; then
                echo "FUSIONAUTH_CLIENT_SECRET and SESSION_SECRET secrets must be set" >&2
                exit 1
              fi
            fi
            if [ "$CONTAINER" = "simulationDB" ]; then
              cat > .env <<EOF
            POSTGRES_USER=dbadmin
            POSTGRES_PASSWORD=$DBADMIN_PASSWORD
            POSTGRES_DB=simulation
            SIMULATION_ROLE_PASSWORD=$SIMULATIONDB_PASSWORD
            FUSIONAUTH_ROLE_PASSWORD=$FUSIONAUTHDB_PASSWORD
            EOF
            fi
            if [ "$CONTAINER" = "simulationAPI" ]; then
              cat > .env <<EOF
            DATABASE_URL=postgresql://simulation:$SIMULATIONDB_PASSWORD@simulationdb:5432/simulation
            AUTH_ISSUER=https://id.makejohnacoffee.com
            AUTH_CLIENT_ID=c37d57fd-f64d-42fc-bf27-048d658009ca
            AUTH_CLIENT_SECRET=$FUSIONAUTH_CLIENT_SECRET
            AUTH_REDIRECT_URI=https://allin.makejohnacoffee.com/auth/callback
            AUTH_APP_URL=https://allin.makejohnacoffee.com
            SESSION_SECRET=$SESSION_SECRET
            EOF
            fi

            # FusionAuth (ADR-006): reuses simulationDB, no bundled Postgres.
            # ROOT_* are the dbadmin superuser (ADR-008) — used only to create
            # and upgrade the schema; USERNAME/PASSWORD are its own runtime
            # role, fenced into the fusionauth database by simulationDB's
            # first-boot script. SEARCH_TYPE=database keeps OpenSearch off.
            if [ "$CONTAINER" = "fusionAuth" ]; then
              if [ -z "$DBADMIN_PASSWORD" ] || [ -z "$FUSIONAUTHDB_PASSWORD" ]; then
                echo "DBADMIN_PASSWORD and FUSIONAUTHDB_PASSWORD secrets must be set" >&2
                exit 1
              fi
              # Kickstart (first boot on an empty database) replaces the
              # Setup Wizard, so the admin login it creates must be real —
              # empty values here would mean no admin access on a rebuilt box.
              if [ -z "$FUSIONAUTH_ADMIN_EMAIL" ] || [ -z "$FUSIONAUTH_ADMIN_PASSWORD" ]; then
                echo "FUSIONAUTH_ADMIN_EMAIL and FUSIONAUTH_ADMIN_PASSWORD secrets must be set" >&2
                exit 1
              fi
              cat > .env <<EOF
            DATABASE_URL=jdbc:postgresql://simulationdb:5432/fusionauth
            DATABASE_ROOT_USERNAME=dbadmin
            DATABASE_ROOT_PASSWORD=$DBADMIN_PASSWORD
            DATABASE_USERNAME=fusionauth
            DATABASE_PASSWORD=$FUSIONAUTHDB_PASSWORD
            SEARCH_TYPE=database
            FUSIONAUTH_APP_MEMORY=512M
            FUSIONAUTH_APP_RUNTIME_MODE=production
            FUSIONAUTH_APP_URL=http://localhost:9011
            FUSIONAUTH_ADMIN_EMAIL=$FUSIONAUTH_ADMIN_EMAIL
            FUSIONAUTH_ADMIN_PASSWORD=$FUSIONAUTH_ADMIN_PASSWORD
            FUSIONAUTH_KICKSTART_API_KEY=$(openssl rand -hex 32)
            EOF
            fi

            if [ "$BUILD" = "true" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
              docker compose pull
              # Refresh the box's local :latest so a bare `docker compose run`
              # (which defaults to :latest and never pulls) reflects this deploy
              # instead of a stale cached image.
              docker pull "${IMAGE%:*}:latest"
            else
              docker compose pull
            fi
            docker compose up -d
            docker image prune -f
